name: ci
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 1 * *'
jobs:
  check:
    name: Check code format
    runs-on: self-hosted
    container:
      image: ubuntu:24.04

    steps:
      # Install tools
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates clang-format git pcregrep

      # Checkout mender-zephyr-example
      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          path: mender-zephyr-example

      # Check code format
      - name: Check headers
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_headers.sh
      - name: Check include guards
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_include_guards.sh
      - name: Check equivalence tests
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_equivalence_tests.sh
      - name: Check code format
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_code_format.sh

  setup:
    name: Setup Mender server
    runs-on: self-hosted
    container:
      image: docker/compose:debian-1.29.2
      options: --privileged

    steps:
      # Checkout mender-server
      - name: Checkout mender-server
        uses: actions/checkout@v5
        with:
          repository: mendersoftware/mender-server
          ref: v4.0.0
          submodules: recursive
          path: mender-server

      # Start mender-server
      # This sometimes fails probably due to limited performances of the test machine - Server is restarted until it properly starts
      # mender-server username and password are setup so that test scripts can later connect to the server
      - name: Setup Mender server
        working-directory: mender-server
        run: |
          echo "Starting mender-server containers"
          export MENDER_IMAGE_TAG=v4.0.0
          docker compose up -d
          sleep 5
          i=1
          exited=$(docker compose ps -a | grep Exited | wc -l)
          while [ $i -le 5] && [ $exited -ne 0 ]
          do
            echo "An error occured while starting mender-server containers"
            echo "Restarting mender-server containers"
            docker compose restart
            sleep 5
            exited=$(docker compose ps -a | grep Exited | wc -l)
            i=$(($i+1))
          done
          if [ $exited -ne 0 ]; then
            echo "Unable to start mender-server containers"
            exit 1
          fi
          echo "Setup mender-server username and password"
          docker compose run --name create-user useradm create-user --username "${{ secrets.MENDER_USER }}" --password "${{ secrets.MENDER_PASS }}"
          openssl x509 -in /__w/mender-zephyr-example/mender-zephyr-example/mender-server/compose/certs/mender.crt -outform der -out /__w/mender-zephyr-example/mender.der

  tests:
    name: Execute tests on the targets
    runs-on: self-hosted
    needs: setup
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.4
      volumes:
        - /dev:/dev
        - /var/run/docker.sock:/var/run/docker.sock
        - /home/testbench/mender-zephyr-example/local.conf:/__w/mender-zephyr-example/local.conf
        - /home/testbench/mender-zephyr-example/map.yml:/__w/mender-zephyr-example/map.yml
      options: --privileged

      #
      #/home/testbench/mender-zephyr-example/mender.crt:/__w/mender-zephyr-example/mender.crt
        #/home/testbench/mender-zephyr-example/mender.der:/__w/mender-zephyr-example/mender.der

    steps:
      # Install docker and related tools
      # This is used later to start mender-server
      #- name: Install docker
      #  run: |
      #    apt-get update
      #    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
      #      ca-certificates curl
      #    install -m 0755 -d /etc/apt/keyrings
      #    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      #    chmod a+r /etc/apt/keyrings/docker.asc
      #    echo \
      #      "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
      #      $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
      #      tee /etc/apt/sources.list.d/docker.list > /dev/null
      #    apt-get update
      #    DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
      #      docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # Configure docker network subnet so that it doesn't conflict with the host subnet
      # This is done to permit mender containers connecting to the mender-mongo instance
      #- name: Configure Docker network subnet
      #  run: |
      #    echo '{
      #      "bip": "172.30.0.1/16"
      #    }' | sudo tee /etc/docker/daemon.json

      # Install mender-artifact
      # This tool is used to generate artifact for firmware update
      - name: Install mender-artifact
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            apt-transport-https ca-certificates curl gnupg jq
          curl -fsSL https://downloads.mender.io/repos/debian/gpg | sudo tee /etc/apt/trusted.gpg.d/mender.asc
          sed -i.bak -e "\,https://downloads.mender.io/repos/workstation-tools,d" /etc/apt/sources.list
          echo "deb [arch=$(dpkg --print-architecture)] https://downloads.mender.io/repos/workstation-tools debian/trixie/stable main" | tee /etc/apt/sources.list.d/mender.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mender-artifact
      #- name: TODO REM
      #  run: |
      #    echo ${{ github.workspace }}
      #    echo $GITHUB_WORKSPACE
      #    id
      #    ls -l /var/run/docker.sock
      #    docker info || echo "Docker not reachable"
      ##    docker ps
      #    docker container ls -a
      #    docker image ls
      #    docker volume ls
      #    ifconfig -a

      # Checkout mender-zephyr-example
      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          submodules: recursive
          path: mender-zephyr-example

      # Checkout mender-server
      #- name: Checkout mender-server
      #  uses: actions/checkout@v5
      #  with:
      #    repository: mendersoftware/mender-server
      #    ref: v4.0.0
      #    submodules: recursive
      #    path: mender-server

      # Start mender-server
      # mender-server username and password are setup so that test scripts can later connect to the server
      - name: Setup Mender server
        working-directory: mender-server
        run: |
          export MENDER_IMAGE_TAG=v4.0.0
          docker compose up -d
          docker compose run --name create-user useradm create-user --username "${{ secrets.MENDER_USER }}" --password "${{ secrets.MENDER_PASS }}"
          openssl x509 -in /__w/mender-zephyr-example/mender-zephyr-example/mender-server/compose/certs/mender.crt -outform der -out /__w/mender-zephyr-example/mender.der

      #- name: TODO REM
      #  run: |
      #    echo "--- Docker network status ---"
      #    docker ps
      #    docker network ls
      #    docker network inspect mender_default | grep -E "Name|IPv4"
      #    echo "--- Ping test ---"
      #    docker exec mender-deviceauth ping -c3 mender-mongo || true
      #    cat /etc/docker/daemon.json || true
      #    docker exec -it mender-deviceauth-1 ping -c2 mender-mongo-1 || true
      #    docker exec -it mender-deviceauth-1 nc -zv mender-mongo-1 27017 || true

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Install additional Python tools
      # The following tools are installed:
      # pytest-dependency: is used to define dependencies between the test cases
      - name: Install Python tools
        run: |
          pip install pytest-dependency

      # Setup Zephyr project
      # Toolchains are installed to build the application for all supported boards
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: mender-zephyr-example
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32_zephyr-elf
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Execute tests using twister
      # The following options are used:
      # --allow-installed-plugin: allow using pytest-dependency
      # --enable-slow: execute test with "slow: true" in the testcase.yml file
      # --inline-logs: print logs to stdout
      # --device-testing: test on devices
      # --hardware-map: Hardware map file, specific to the testbench machine
      # -x: Extra arguments, used to pass EXTRA_CONF_FILE to specify local.conf options, specific to the testbench machine
      # The following environment variables are defined:
      # - MENDER_SERVER: mender-server URL "https://docker.mender.io"
      # - MENDER_USER: mender-server username previsouly defined
      # - MENDER_PASS: mender-server password previsouly defined
      # - MENDER_CA: mender-server certificate path to connect to the server
      - name: Execute tests
        working-directory: mender-zephyr-example
        run: |
          west twister -T app -v --allow-installed-plugin --enable-slow --inline-logs --device-testing --hardware-map /__w/mender-zephyr-example/map.yml -x=EXTRA_CONF_FILE=/__w/mender-zephyr-example/local.conf
        env:
          MENDER_SERVER: "https://docker.mender.io"
          MENDER_USER: ${{ secrets.MENDER_USER }}
          MENDER_PASS: ${{ secrets.MENDER_PASS }}
          MENDER_CA: "/__w/mender-zephyr-example/mender-zephyr-example/mender-server/compose/certs/mender.crt"

      # Upload artifacts
      # This step is always executed, so that we can get logs even in case of failure during the execution of the tests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results
          path: mender-zephyr-example/twister-out
          include-hidden-files: true

      # Cleanup Zephyr build
      - name: Cleanup build
        if: ${{ always() }}
        run: |
          rm -rf .west

      # Stop mender-server
      #- name: Shutdown Mender server
      #  working-directory: mender-server
      #  if: ${{ always() }}
      #  run: |
      #    docker compose stop
      #    docker compose down -v --remove-orphans

# TODO how to remove unused docker images ?

  teardown:
    name: Stop Mender server
    runs-on: self-hosted
    needs: tests
    container:
      image: docker/compose:debian-1.29.2
      options: --privileged

    steps:
      # Stop mender-server
      - name: Shutdown Mender server
        working-directory: mender-server
        if: ${{ always() }}
        run: |
          docker compose down -v --remove-orphans
