name: ci
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 1 * *'
jobs:
  check:
    name: Check code format
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: mender-zephyr-example
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y clang-format pcregrep
      - name: Check headers
        run: |
          ./.github/workflows/check_headers.sh
      - name: Check include guards
        run: |
          ./.github/workflows/check_include_guards.sh
      - name: Check equivalence tests
        run: |
          ./.github/workflows/check_equivalence_tests.sh
      - name: Check code format
        run: |
          ./.github/workflows/check_code_format.sh
  test:
    name: Execute tests on the targets
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: mender-zephyr-example
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            sudo git
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
        env:
          PIP_ROOT_USER_ACTION: ignore
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: mender-zephyr-example
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32_zephyr-elf
        env:
          PIP_ROOT_USER_ACTION: ignore
      - name: Checkout submodules
        working-directory: mender-zephyr-example
        run: git submodule update --init --recursive
      - name: Build firmware
        working-directory: mender-zephyr-example
        run: |
          west twister -T app -v --inline-logs --device-testing --hardware-map map.yml
