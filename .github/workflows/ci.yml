name: ci
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 1 * *'
jobs:
  check:
    name: Check code format
    runs-on: self-hosted
    container:
      image: ubuntu:24.04

    steps:
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates clang-format git pcregrep

      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          path: mender-zephyr-example

      - name: Check headers
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_headers.sh
      - name: Check include guards
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_include_guards.sh
      - name: Check equivalence tests
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_equivalence_tests.sh
      - name: Check code format
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_code_format.sh

  test:
    name: Execute tests on the targets
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.4
      volumes:
        - /dev:/dev
        - /home/testbench/mender-zephyr-example/local.conf:/__w/mender-zephyr-example/local.conf
        - /home/testbench/mender-zephyr-example/mender.crt:/__w/mender-zephyr-example/mender.crt
        - /home/testbench/mender-zephyr-example/mender.der:/__w/mender-zephyr-example/mender.der
        - /home/testbench/mender-zephyr-example/map.yml:/__w/mender-zephyr-example/map.yml
      options: --privileged

    steps:
      - name: TODO REM
        run: |
          echo ${{ github.workspace }}
          echo $GITHUB_WORKSPACE

#      - name: Install tools
#        run: |
#          apt-get update
#          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
#            ca-certificates curl
#          install -m 0755 -d /etc/apt/keyrings
#          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
#          chmod a+r /etc/apt/keyrings/docker.asc
#          echo \
#            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
#            $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
#            tee /etc/apt/sources.list.d/docker.list > /dev/null
#          apt-get update
#          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
#            docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Install mender-artifact
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            apt-transport-https ca-certificates curl gnupg jq
          curl -fsSL https://downloads.mender.io/repos/debian/gpg | sudo tee /etc/apt/trusted.gpg.d/mender.asc
          sed -i.bak -e "\,https://downloads.mender.io/repos/workstation-tools,d" /etc/apt/sources.list
          echo "deb [arch=$(dpkg --print-architecture)] https://downloads.mender.io/repos/workstation-tools debian/trixie/stable main" | tee /etc/apt/sources.list.d/mender.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mender-artifact

      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          submodules: recursive
          path: mender-zephyr-example

     # - name: Checkout mender-server
     #   uses: actions/checkout@v5
     #   with:
     #     repository: mendersoftware/mender-server
     #     ref: v4.0.1
     #     submodules: recursive
     #     path: mender-server

      #- name: Setup Mender server
     #   working-directory: mender-server
     #   run: |
     #     export MENDER_IMAGE_TAG=v4.0.1
     #     docker compose up -d
     #     MENDER_USERNAME=admin@docker.mender.io
     #     MENDER_PASSWORD=PleaseReplaceWithASecurePassword
     #     docker compose run --name create-user useradm create-user --username "$MENDER_USERNAME" --password "$MENDER_PASSWORD"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
        env:
          PIP_ROOT_USER_ACTION: ignore

      - name: Install Python tools
        run: |
          pip install pytest-dependency

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: mender-zephyr-example
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32_zephyr-elf
        env:
          PIP_ROOT_USER_ACTION: ignore

      - name: Execute tests
        working-directory: mender-zephyr-example
        run: |
          west twister -T app -v --allow-installed-plugin --enable-slow --inline-logs --device-testing --hardware-map /__w/mender-zephyr-example/map.yml -x=EXTRA_CONF_FILE=/__w/mender-zephyr-example/local.conf
        env:
          MENDER_SERVER: "https://docker.mender.io"
          MENDER_USER: ${{ secrets.MENDER_USER }}
          MENDER_PASS: ${{ secrets.MENDER_PASS }}
          MENDER_CA: "/__w/mender-zephyr-example/mender.crt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results
          path: mender-zephyr-example/twister-out
          include-hidden-files: true

      - name: Cleanup build
        if: ${{ always() }}
        run: |
          rm -rf .west

