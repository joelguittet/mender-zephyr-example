name: ci
on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 1 * *'
jobs:
  check:
    name: Check code format
    runs-on: self-hosted
    container:
      image: ubuntu:24.04

    steps:
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-format pcregrep

      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          path: mender-zephyr-example

      - name: Check headers
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_headers.sh
      - name: Check include guards
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_include_guards.sh
      - name: Check equivalence tests
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_equivalence_tests.sh
      - name: Check code format
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_code_format.sh

  test:
    name: Execute tests on the targets
    runs-on: self-hosted
    # was ubuntu:24.04, check if not enough ..... maybe some missing packages in the zephyr setup step?
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.4
      volumes:
        - /dev:/dev
        - /home/testbench/mender-zephyr-example/map.yml:/__w/mender-zephyr-example/map.yml
      options: --privileged

    steps:
     # - name: Install tools
    #    run: |
   #       apt-get update && apt-get -y upgrade
  #        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
 #           sudo git cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
#            python3-dev python3-venv python3-tk xz-utils file make \
#            gcc gcc-multilib g++-multilib libsdl2-dev libmagic1
# libmagic1 et python3-tk non installé dans le docker de zephyr (devrait pas etre genant)

      - name: END TODO REMOVE
        run: |
          whoami
          ls -la /dev/serial/by-path/*
          ls -la /dev/serial/by-id/*

      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          submodules: recursive
          path: mender-zephyr-example

      - name: Checkout mender-server
        uses: actions/checkout@v5
        with:
          repository: mendersoftware/mender-server
          ref: v4.0.1
          submodules: recursive
          path: mender-server

      - name: Setup Mender server
        working-directory: mender-server
        run: |
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
        env:
          PIP_ROOT_USER_ACTION: ignore

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: mender-zephyr-example
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32_zephyr-elf
        env:
          PIP_ROOT_USER_ACTION: ignore

      - name: Execute tests
        working-directory: mender-zephyr-example
        run: |
          west twister -T app -v --inline-logs --device-testing --hardware-map /__w/mender-zephyr-example/map.yml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: mender-zephyr-example/twister-out
          include-hidden-files: true

      - name: Cleanup build
        working-directory: mender-zephyr-example
        if: ${{ always() }}
        run: |
          rm -rf .west

      - name: Cleanup Mender server
        working-directory: mender-server
        if: ${{ always() }}
        run: |
          whoami
