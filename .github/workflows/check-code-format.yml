name: ci

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  check-code-format:
    name: Check code format
    runs-on: self-hosted
    container:
      image: ubuntu:24.04

    steps:
      # Install tools
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates clang-format git pcregrep

      # Checkout mender-zephyr-example
      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v5
        with:
          path: mender-zephyr-example

      # Check code format
      - name: Check headers
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_headers.sh
      - name: Check include guards
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_include_guards.sh
      - name: Check equivalence tests
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_equivalence_tests.sh
      - name: Check code format
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          ./.github/workflows/check_code_format.sh
