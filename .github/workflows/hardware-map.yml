name: hardware-map

on:
  workflow_dispatch:

jobs:
  generate-hardware-map:
    name: Generate hardware map
    runs-on: self-hosted
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.4
      volumes:
        - /dev:/dev
      options: --privileged

    steps:
      # Checkout mender-zephyr-example
      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: mender-zephyr-example

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Setup Zephyr project
      # Toolchains are installed to build the application for all supported boards
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@8354324d917cd398fb48d5fdd759cd61e147f084
        with:
          app-path: mender-zephyr-example
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Generate hardware map using twister
      # The following options is used:
      # --generate-hardware-map: generate hardware map
      - name: Generate hardware map
        run: |
          west twister --generate-hardware-map map.yml

      # Upload hardware-map artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: hardware-map
          path: map.yml

      # Cleanup Zephyr environment
      - name: Cleanup build
        if: ${{ always() }}
        run: |
          rm -rf .west
