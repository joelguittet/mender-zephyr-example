name: device-testing

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# Define concurrency so that the jobs of the workflow are not mixed between
# several executions in case it is launched again while one is still running
concurrency:
  group: device-testing
  cancel-in-progress: false

jobs:
  device-testing:
    name: Test execution
    runs-on: self-hosted
    timeout-minutes: 120
    # Twister is executed inside ghcr.io/zephyrproject-rtos/ci container
    # The container is executed with privileged option to have full access to the host
    # The following are bounded in the container:
    # - /dev: to allow access to the devices
    # - local.conf: contains configuration of the test bench such as Mender server and Wi-Fi settings
    # - map.yml: the twister hardware map corresponding to the devices physically connected to the test bench
    # - mender.crt/mender.der: mender-server certificate to allow device and tests connecting to the server
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.0
      volumes:
        - /dev:/dev
        - /home/testbench/mender-zephyr-example/local.conf:/__w/mender-zephyr-example/mender-zephyr-example/local.conf
        - /home/testbench/mender-zephyr-example/map.yml:/__w/mender-zephyr-example/mender-zephyr-example/map.yml
        - /home/testbench/mender-server/compose/certs/mender.crt:/__w/mender-zephyr-example/mender-zephyr-example/mender.crt
        - /home/testbench/mender-server/compose/certs/mender.der:/__w/mender-zephyr-example/mender-zephyr-example/mender.der
      options: --privileged
    # Permissions
    # - contents: read, actions: read and checks: write are required to use dorny/test-reporter@v3
    permissions:
      contents: read
      actions: read
      checks: write

    steps:
      # Install mender-artifact and mender-cli
      # mender-artifact is used to generate artifact for firmware update
      # mender-cli is used to connect to the troubleshoot terminal of the device
      - name: Install mender-artifact and mender-cli
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            apt-transport-https ca-certificates curl gnupg jq
          curl -fsSL https://downloads.mender.io/repos/debian/gpg | tee /etc/apt/trusted.gpg.d/mender.asc
          sed -i.bak -e "\,https://downloads.mender.io/repos/workstation-tools,d" /etc/apt/sources.list
          echo "deb [arch=$(dpkg --print-architecture)] https://downloads.mender.io/repos/workstation-tools debian/trixie/stable main" | tee /etc/apt/sources.list.d/mender.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mender-artifact mender-cli

      # Install Raspberry Pi's downstream fork of OpenOCD (used to flash rpi_pico2 board)
      - name: Install Raspberry Pi's downstream fork of OpenOCD
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential autoconf automake libtool pkg-config libusb-1.0-0-dev libhidapi-dev libjim-dev tcl
          cd $(mktemp -d)
          git clone https://github.com/raspberrypi/openocd.git
          cd openocd
          git checkout $OPENOCD_VERSION
          git submodule update --init --recursive
          ./bootstrap
          ./configure --enable-cmsis-dap
          make -j$(nproc)
          make install
          which openocd
          openocd --version
        env:
          OPENOCD_VERSION: e23a6bbc635aa426668c040abda8c2d38628e8d4

      # Install LinkServer (used to flash frdm-mcxn947 board)
      - name: Install LinkServer
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            whiptail libusb-1.0-0-dev dfu-util usbutils hwdata udev wget
          /lib/systemd/systemd-udevd --daemon
          wget https://www.nxp.com/lgfiles/updates/mcuxpresso/LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin
          chmod a+x LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin
          ./LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin acceptLicense skipIdeSelect
          echo "/usr/local/LinkServer_${LINK_SERVER_VERSION}" >> "$GITHUB_PATH"
          rm LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin
        env:
          LINK_SERVER_VERSION: 25.9.134

      # Checkout mender-zephyr-example
      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: mender-zephyr-example

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Setup Zephyr project
      # Toolchains are installed to build the application for all supported boards:
      # - arm-zephyr-eabi: to support frdm-mcxn947, nucleo-l4a6zg and rpi_pico2 boards
      # - xtensa-espressif_esp32_zephyr-elf: to support esp32-devkitc
      - name: Setup Zephyr project
        # TODO switch to zephyrproject-rtos after west patch supprot is merged
        #uses: zephyrproject-rtos/action-zephyr-setup@v1
        uses: joelguittet/action-zephyr-setup@e635c09c0c6684e888210d528abfbb6455f8f60a
        with:
          app-path: mender-zephyr-example
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32_zephyr-elf
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Fetch blobs
      # The following blobs are fetch:
      # - hal_espressif: to support esp32-devkitc board
      # - hal_infineon: to support rpi_pico2 board
      - name: Fetch blobs
        working-directory: mender-zephyr-example
        run: |
          west blobs fetch hal_espressif
          west blobs fetch hal_infineon

      # TODO CLEAN
      # Install openocd configuration files
      # The following configuration files are installed:
      # - rp2350.cfg: to support rpi_pico2 board
      #- name: Install openocd configuration files
      #  run: |
      #    ls -l
      #    ls -l zephyr-sdk/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd
      #    ls -l zephyr-sdk/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts/target
      #    wget https://raw.githubusercontent.com/raspberrypi/openocd/e23a6bbc635aa426668c040abda8c2d38628e8d4/tcl/target/rp2350.cfg -O zephyr-sdk/hosttools/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts/target/rp2350.cfg

      # Execute tests using twister
      # The following options are used:
      # --allow-installed-plugin: allow using pytest-dependency
      # --enable-slow: execute test with "slow: true" in the testcase.yml file
      # --inline-logs: print logs to stdout
      # --device-testing: test on devices
      # --hardware-map: Hardware map file, specific to the testbench machine
      # The following environment variables are defined:
      # - MENDER_SERVER: mender-server URL "https://docker.mender.io"
      # - MENDER_USER: mender-server username previsouly defined
      # - MENDER_PASS: mender-server password previsouly defined
      # - MENDER_CA: mender-server certificate path to connect to the server
      - name: Execute tests
        working-directory: mender-zephyr-example
        id: execute-tests
        run: |
          west twister -T app -v --allow-installed-plugin --enable-slow --inline-logs --device-testing --hardware-map /__w/mender-zephyr-example/mender-zephyr-example/map.yml
        env:
          MENDER_SERVER: "https://docker.mender.io"
          MENDER_USERNAME: ${{ secrets.MENDER_USERNAME }}
          MENDER_PASSWORD: ${{ secrets.MENDER_PASSWORD }}
          MENDER_CA: "/__w/mender-zephyr-example/mender-zephyr-example/mender.crt"

      # Publish test results
      - name: Publish test results
        if: ${{ always() && steps.execute-tests.conclusion != 'skipped' && steps.execute-tests.conclusion != 'cancelled' }}
        uses: dorny/test-reporter@v3
        with:
          working-directory: mender-zephyr-example
          name: 🧪 Zephyr Twister Test Report
          path: twister-out/twister_report.xml
          reporter: java-junit
          report-title: 🧪 Zephyr Twister Test Report

      # Upload test-results artifact
      # This step is always executed, so that we can get logs even in case of failure during the execution of the tests
      - name: Upload artifact
        if: ${{ always() && steps.execute-tests.conclusion != 'skipped' && steps.execute-tests.conclusion != 'cancelled' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: error
          retention-days: 7
          path: |
            mender-zephyr-example/twister-out/testplan.json
            mender-zephyr-example/twister-out/twister.json
            mender-zephyr-example/twister-out/twister.log
            mender-zephyr-example/twister-out/twister.xml
            mender-zephyr-example/twister-out/twister_report.xml
            mender-zephyr-example/twister-out/twister_suite_report.xml
            mender-zephyr-example/twister-out/**/build.log
            mender-zephyr-example/twister-out/**/device.log
            mender-zephyr-example/twister-out/**/handler.log
            mender-zephyr-example/twister-out/**/report.xml
            mender-zephyr-example/twister-out/**/twister_harness.log

      # Cleanup dangling devices and artifacts on mender-server
      - name: Cleanup dangling devices and artifacts on mender-server
        if: ${{ always() }}
        run: |
          # Login to mender-server
          TOKEN=$(curl -s -X POST https://docker.mender.io/api/management/v1/useradm/auth/login --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Content-Type: application/json" -H "Accept: application/jwt" -H "Authorization: Basic $(printf "%s" "${{ secrets.MENDER_USERNAME }}:${{ secrets.MENDER_PASSWORD }}" | base64)")
          # Abort all the active and pending deployments
          curl -s https://docker.mender.io/api/management/v1/inventory/devices?inventory/device_type=mender-zephyr-example --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Authorization: Bearer $TOKEN" | jq -r '.[] | .id' | while read id; do echo "Abort deployment for device with id '$id'"; curl -s -X DELETE https://docker.mender.io/api/management/v1/deployments/deployments/devices/$id --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Authorization: Bearer $TOKEN"; done
          # Remove artifacts
          curl -s https://docker.mender.io/api/management/v2/deployments/artifacts?device_type=mender-zephyr-example --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Authorization: Bearer $TOKEN" | jq -r '.[] | .id' | while read id; do echo "Removing artifact with id '$id'"; curl -s -X DELETE https://docker.mender.io/api/management/v1/deployments/artifacts/$id --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Authorization: Bearer $TOKEN"; done
          # Remove devices
          curl -s https://docker.mender.io/api/management/v1/inventory/devices?inventory/device_type=mender-zephyr-example --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Authorization: Bearer $TOKEN" | jq -r '.[] | .id' | while read id; do echo "Removing device with id '$id'"; curl -s -X DELETE https://docker.mender.io/api/management/v2/devauth/devices/$id --cacert /__w/mender-zephyr-example/mender-zephyr-example/mender.crt -H "Authorization: Bearer $TOKEN"; done

      # Cleanup twister results
      - name: Cleanup twister results
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          rm -rf twister-out

      # Cleanup Zephyr environment
      - name: Cleanup Zephyr environment
        if: ${{ always() }}
        run: |
          rm -rf .west

  publish-test-results:
    name: Publish test results
    runs-on: ubuntu-24.04
    if: ${{ always() && !contains(needs.device-testing.result, 'skipped') && !contains(needs.device-testing.result, 'cancelled') }}
    needs: device-testing
    # Permissions
    # - contents: read, issues: read checks: write and pull-requests: write are required to use EnricoMi/publish-unit-test-result-action/linux@v2
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      # Download artifacts
      # This step is used to retrieve test results so they can be used to publish report
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Publish test results
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        with:
          files: artifacts/test-results/twister_report.xml
