name: device-testing

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

# Define concurrency so that the jobs of the workflow are not mixed between
# several executions in case it is launched again while one is still running
concurrency:
  group: device-testing
  cancel-in-progress: false

jobs:
  setup:
    name: Setup Mender server
    runs-on: self-hosted

    steps:
      # Checkout mender-server
      - name: Checkout mender-server
        uses: actions/checkout@v6
        with:
          repository: mendersoftware/mender-server
          ref: 8d34064338d1a1ffbe83f710e97f9f007b779354
          path: mender-server

      # Start mender-server
      # Refer to https://docs.mender.io/server-installation/evaluation-with-docker-compose
      # mender-server username and password are setup so that test scripts can later connect to the server
      # mender-server certificate is converted to der format to be integrated in the devices
      - name: Setup Mender server
        working-directory: mender-server
        run: |
          echo "Starting mender-server containers"
          export MENDER_IMAGE_TAG=v4.0.1
          docker compose up -d
          echo "Setup mender-server username and password"
          MENDER_USERNAME=admin@docker.mender.io
          MENDER_PASSWORD=PleaseReplaceWithASecurePassword
          docker compose run --name create-user useradm create-user --username "$MENDER_USERNAME" --password "$MENDER_PASSWORD"
          echo "Convert mender-server certificate to der format"
          openssl x509 -in ${{ github.workspace }}/mender-server/compose/certs/mender.crt -outform der -out ${{ github.workspace }}/mender-server/compose/certs/mender.der

      # Upload mender-certs artifact
      # This step is used to save mender certificates so they can be used for tests
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mender-certs
          if-no-files-found: error
          retention-days: 1
          path: ${{ github.workspace }}/mender-server/compose/certs

  device-testing:
    name: Test execution
    runs-on: self-hosted
    timeout-minutes: 60
    needs: setup
    # Twister is executed inside zephyrproject-rtos/ci container
    # The container is executed with privileged option to have full access to the host
    # The following are bounded in the container:
    # - /dev: to allow access to the devices
    # - local.conf: contains configuration of the test bench such as Mender server and Wi-Fi settings
    # - map.yml: the twister hardware map corresponding to the devices physically connected to the test bench
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.28.7
      volumes:
        - /dev:/dev
        - /home/testbench/mender-zephyr-example/local.conf:/__w/mender-zephyr-example/mender-zephyr-example/local.conf
        - /home/testbench/mender-zephyr-example/map.yml:/__w/mender-zephyr-example/mender-zephyr-example/map.yml
      options: --privileged

    steps:
      # Download mender-certs artifact
      # This step is used to retrieve mender certificates so they can be used for tests
      - uses: actions/download-artifact@v6
        with:
          name: mender-certs
          path: ${{ github.workspace }}

      # Install mender-artifact and mender-cli
      # mender-artifact is used to generate artifact for firmware update
      # mender-cli is used to connect to the troubleshoot terminal of the device
      - name: Install mender-artifact and mender-cli
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            apt-transport-https ca-certificates curl gnupg jq
          curl -fsSL https://downloads.mender.io/repos/debian/gpg | sudo tee /etc/apt/trusted.gpg.d/mender.asc
          sed -i.bak -e "\,https://downloads.mender.io/repos/workstation-tools,d" /etc/apt/sources.list
          echo "deb [arch=$(dpkg --print-architecture)] https://downloads.mender.io/repos/workstation-tools debian/trixie/stable main" | tee /etc/apt/sources.list.d/mender.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mender-artifact mender-cli

      # Install LinkServer (used to flash frdm-mcxn947 board)
      - name: Install LinkServer
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            whiptail libusb-1.0-0-dev dfu-util usbutils hwdata udev wget
          /lib/systemd/systemd-udevd --daemon
          wget https://www.nxp.com/lgfiles/updates/mcuxpresso/LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin
          chmod a+x LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin
          ./LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin acceptLicense skipIdeSelect
          echo "/usr/local/LinkServer_${LINK_SERVER_VERSION}" >> "$GITHUB_PATH"
          rm LinkServer_${LINK_SERVER_VERSION}.x86_64.deb.bin
        env:
          LINK_SERVER_VERSION: 25.9.134

      # Install J-Link (used to flash nrf7002-dk board)
      - name: Install J-Link
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libxcb-render-util0 libxcb-shape0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxkbcommon-x11-0 udev curl
          /lib/systemd/systemd-udevd --daemon
          curl -d "accept_license_agreement=accepted&submit=Download+software" -X POST -O "https://www.segger.com/downloads/jlink/JLink_Linux_${JLINK_VERSION}_x86_64.deb"
          dpkg -i JLink_Linux_${JLINK_VERSION}_x86_64.deb
          rm JLink_Linux_${JLINK_VERSION}_x86_64.deb
        env:
          JLINK_VERSION: V890

      # Checkout mender-zephyr-example
      - name: Checkout mender-zephyr-example
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: mender-zephyr-example

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Setup Zephyr project
      # Toolchains are installed to build the application for all supported boards:
      # - arm-zephyr-eabi: to support frdm-mcxn947, nrf7002-dk and nucleo-l4a6zg boards
      # - xtensa-espressif_esp32_zephyr-elf: to support esp32-devkitc
      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@8354324d917cd398fb48d5fdd759cd61e147f084
        with:
          app-path: mender-zephyr-example
          toolchains: arm-zephyr-eabi:xtensa-espressif_esp32_zephyr-elf
        env:
          PIP_ROOT_USER_ACTION: ignore

      # Fetch blobs
      # The following blobs are fetch:
      # - hal_espressif: to support esp32-devkitc board
      # - nrf_wifi: to support nrf7002-dk board
      - name: Fetch blobs
        working-directory: mender-zephyr-example
        run: |
          west blobs fetch hal_espressif
          west blobs fetch nrf_wifi

      # Execute tests using twister
      # The following options are used:
      # --allow-installed-plugin: allow using pytest-dependency
      # --enable-slow: execute test with "slow: true" in the testcase.yml file
      # --inline-logs: print logs to stdout
      # --device-testing: test on devices
      # --flash-before: flash before opening console, useful for boards sharing the same serial port for flashing and console
      # --hardware-map: Hardware map file, specific to the testbench machine
      # The following environment variables are defined:
      # - MENDER_SERVER: mender-server URL "https://docker.mender.io"
      # - MENDER_USER: mender-server username previsouly defined
      # - MENDER_PASS: mender-server password previsouly defined
      # - MENDER_CA: mender-server certificate path to connect to the server
      - name: Execute tests
        working-directory: mender-zephyr-example
        id: execute-tests
        run: |
          west twister -T app -v --allow-installed-plugin --enable-slow --inline-logs --device-testing --flash-before --hardware-map /__w/mender-zephyr-example/mender-zephyr-example/map.yml
        env:
          MENDER_SERVER: "https://docker.mender.io"
          MENDER_USERNAME: "admin@docker.mender.io"
          MENDER_PASSWORD: "PleaseReplaceWithASecurePassword"
          MENDER_CA: "/__w/mender-zephyr-example/mender-zephyr-example/mender-server/compose/certs/mender.crt"

      # Analyse test results
      # This step is always executed, so that we can get logs even in case of failure during the execution of the tests
      - name: Analyze test results
        if: ${{ always() && steps.execute-tests.conclusion != 'skipped' && steps.execute-tests.conclusion != 'cancelled' }}
        working-directory: mender-zephyr-example
        run: |
          python3 scripts/twister_report_summary.py twister-out/twister_report.xml > twister-out/summary.md
          cat twister-out/summary.md > $GITHUB_STEP_SUMMARY

      # Upload test-results artifact
      # This step is always executed, so that we can get logs even in case of failure during the execution of the tests
      - name: Upload artifact
        if: ${{ always() && steps.execute-tests.conclusion != 'skipped' && steps.execute-tests.conclusion != 'cancelled' }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          if-no-files-found: error
          retention-days: 7
          path: |
            mender-zephyr-example/twister-out/summary.md
            mender-zephyr-example/twister-out/testplan.json
            mender-zephyr-example/twister-out/twister.json
            mender-zephyr-example/twister-out/twister.log
            mender-zephyr-example/twister-out/twister.xml
            mender-zephyr-example/twister-out/twister_report.xml
            mender-zephyr-example/twister-out/twister_suite_report.xml
            mender-zephyr-example/twister-out/**/build.log
            mender-zephyr-example/twister-out/**/device.log
            mender-zephyr-example/twister-out/**/handler.log
            mender-zephyr-example/twister-out/**/report.xml
            mender-zephyr-example/twister-out/**/twister_harness.log

      # Cleanup twister results
      - name: Cleanup twister results
        if: ${{ always() }}
        working-directory: mender-zephyr-example
        run: |
          rm -rf twister-out

      # Cleanup Zephyr environment
      - name: Cleanup Zephyr environment
        if: ${{ always() }}
        run: |
          rm -rf .west

  teardown:
    name: Stop Mender server
    runs-on: self-hosted
    if: ${{ always() && !contains(needs.setup.result, 'cancelled') }}
    needs: [setup, device-testing]

    steps:
      # Stop mender-server
      - name: Shutdown Mender server
        working-directory: mender-server
        run: |
          docker compose down -v --remove-orphans
