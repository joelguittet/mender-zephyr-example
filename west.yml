manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: joelguittet
      url-base: https://github.com/joelguittet

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application
        name-allowlist:
          - cmsis # required for frdm-mcxn947 board
          - cmsis_6
          - hal_espressif # required for esp32s3-devkitc board
          - hal_infineon # required for rpi_pico2 board
          - hal_nxp # required for frdm-mcxn947 board
          - hal_rpi_pico # required for rpi_pico2 board
          - hal_stm32 # required for nucleo-l4a6zg board
          - littlefs
          - mbedtls
          - mcuboot
          - picolibc
          - tf-psa-crypto # required for mbedtls
          - zcbor # required in case mcumgr is enabled
    - name: mender-mcu-client
      remote: joelguittet
      revision: 0.13.2
      path: modules/lib/mender-mcu-client
