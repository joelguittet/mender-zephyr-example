manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: joelguittet
      url-base: https://github.com/joelguittet

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.2.0
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application.
        name-allowlist:
          - cmsis_6
          - hal_espressif # required for esp TODO board
          - hal_nordic # required for nrf7002dk board
          - hal_stm32 # required for nucleo_l4a6zg board
          - hostap # required for nrf7002dk board
          - littlefs
          - mbedtls
          - mcuboot
          - nrf_hw_models # required for nrf7002dk board
          - nrf_wifi # required for nrf7002dk board
          - picolibc
    - name: mender-mcu-client
      remote: joelguittet
      revision: 0.12.0
