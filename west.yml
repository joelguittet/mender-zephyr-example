manifest:
  self:
    west-commands: scripts/west-commands.yml

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: joelguittet
      url-base: https://github.com/joelguittet

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # TODO move to main / v4.4 when available
      # see https://github.com/zephyrproject-rtos/zephyr/pull/103652
      revision: pull/103652/head
      import:
        # By using name-allowlist we can clone only the modules that are
        # strictly needed by the application
        name-allowlist:
          - cmsis_6
          - hal_espressif # required for esp32-devkitc board
          - hal_nordic # required for nrf7002-dk board
          - hal_nxp # required for frdm-mcxn947 board
          - hal_stm32 # required for nucleo-l4a6zg board
          - hostap # required for nrf7002-dk board
          - littlefs
          - mbedtls
          - mcuboot
          - nrf_hw_models # required for nrf7002-dk board
          - nrf_wifi # required for nrf7002-dk board
          - picolibc
          - zcbor # required in case mcumgr is enabled
    - name: mender-mcu-client
      remote: joelguittet
      # TODO create a new version 0.12.4
      #revision: d1f38dc8e1e2d8e3602582c40cfac54314444eda
      revision: 0.12.3
      path: modules/lib/mender-mcu-client
