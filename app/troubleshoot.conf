# Mender MCU client troubleshoot add-on
CONFIG_MENDER_CLIENT_ADD_ON_TROUBLESHOOT=y
CONFIG_MENDER_CLIENT_TROUBLESHOOT_SHELL=y

# msgpack-c
CONFIG_MSGPACK_C=y

# Maximum number of open file descriptors, this includes files, sockets, special devices, etc.
# CONFIG_ZVFS_OPEN_MAX default value is 16
# nrf7002-dk board requires at least 30
CONFIG_ZVFS_OPEN_MAX=30

# Size of the heap memory pool used when dynamically allocating memory using k_malloc()
# CONFIG_HEAP_MEM_POOL_SIZE minimal value is 1500
# nrf7002-dk board requires at least 31088 bytes
# esp32-devkitc board requires at least 45336 bytes
# TODO CLEAN CONFIG_HEAP_MEM_POOL_SIZE=45336
CONFIG_HEAP_MEM_POOL_SIZE=49152

# Shell
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_AUTOSTART=n
CONFIG_SHELL_STACK_SIZE=3072
