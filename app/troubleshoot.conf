# Mender MCU client troubleshoot add-on
CONFIG_MENDER_CLIENT_ADD_ON_TROUBLESHOOT=y
CONFIG_MENDER_CLIENT_TROUBLESHOOT_SHELL=y
CONFIG_MENDER_CLIENT_TROUBLESHOOT_FILE_TRANSFER=y

# msgpack-c
CONFIG_MSGPACK_C=y

# Required to get Device Troubleshoot add-on working
# CONFIG_HEAP_MEM_POOL_SIZE minimal value is 1500, but nRF7002-DK board requires at least 30808
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ZVFS_OPEN_MAX=16

# Shell
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_AUTOSTART=n
CONFIG_SHELL_STACK_SIZE=3072

# littlefs
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
