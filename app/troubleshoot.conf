# Mender MCU client troubleshoot add-on
CONFIG_MENDER_CLIENT_ADD_ON_TROUBLESHOOT=y
CONFIG_MENDER_CLIENT_TROUBLESHOOT_SHELL=y

# msgpack-c
CONFIG_MSGPACK_C=y

# TODO comment better
# nrf7002dk board requires at least 30
CONFIG_ZVFS_OPEN_MAX=30

# Required to get Device Troubleshoot add-on working
# CONFIG_HEAP_MEM_POOL_SIZE minimal value is 1500
# nrf7002dk board requires at least 31088 bytes
# esp32_devkitc board requires at least 45336 bytes
# TODO seems always required. move it to board ????
CONFIG_HEAP_MEM_POOL_SIZE=45336

# Shell
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_AUTOSTART=n
CONFIG_SHELL_STACK_SIZE=3072
