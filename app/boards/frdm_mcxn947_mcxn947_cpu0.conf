# General
CONFIG_EXAMPLE_ARTIFACT_NAME_PREFIX="mender-frdm-mcxn947-zephyr-example"
CONFIG_EXAMPLE_DEVICE_TYPE="mender-frdm-mcxn947-zephyr-example"

# Ethernet
CONFIG_ETH_NET_IF_NO_AUTO_START=y
CONFIG_ETH_NXP_ENET_QOS_UNIQUE_MAC_ADDRESS=y

# Software fallback RNG (non-secure)
CONFIG_TEST_RANDOM_GENERATOR=y

# NVS
CONFIG_NVS_LOG_LEVEL_ERR=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
