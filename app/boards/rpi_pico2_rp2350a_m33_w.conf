# General
CONFIG_EXAMPLE_ARTIFACT_NAME_PREFIX="mender-rpi_pico2-zephyr-example"
CONFIG_EXAMPLE_DEVICE_TYPE="mender-rpi_pico2-zephyr-example"
# Size of the heap memory pool used when dynamically allocating memory using k_malloc()
CONFIG_HEAP_MEM_POOL_SIZE=16664

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_EXAMPLE_WIFI_SSID="<insert your ssid here>"
CONFIG_EXAMPLE_WIFI_PSK="<insert your password here>"

# NVS
CONFIG_NVS_LOG_LEVEL_ERR=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
