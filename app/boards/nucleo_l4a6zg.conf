# General
CONFIG_EXAMPLE_ARTIFACT_NAME_PREFIX="mender-nucleo-l4a6zg-zephyr-example"
CONFIG_EXAMPLE_DEVICE_TYPE="mender-nucleo-l4a6zg-zephyr-example"
CONFIG_MENDER_PLATFORM_TLS_TYPE_CRYPTOAUTHLIB=y

# cryptoauthlib dependency
CONFIG_CRYPTOAUTHLIB=y
CONFIG_CRYPTOAUTHLIB_HAL_I2C=y
CONFIG_CRYPTOAUTHLIB_ATSHA204A_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_ATSHA206A_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_ATECC108A_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_ATECC508A_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_ATECC608_SUPPORT=y
CONFIG_CRYPTOAUTHLIB_ATECC608A_SUPPORT=y
CONFIG_CRYPTOAUTHLIB_ECC204_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_TA010_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_SHA104_SUPPORT=n
CONFIG_CRYPTOAUTHLIB_SHA105_SUPPORT=n

# Ethernet
CONFIG_ETH_DRIVER=y
CONFIG_ETH_W5500=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_NET_IF_NO_AUTO_START=y

# NVS
CONFIG_NVS_LOG_LEVEL_ERR=y
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
