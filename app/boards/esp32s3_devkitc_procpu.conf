# General
CONFIG_EXAMPLE_ARTIFACT_NAME_PREFIX="mender-esp32s3-devkitc-zephyr-example"
CONFIG_EXAMPLE_DEVICE_TYPE="mender-esp32s3-devkitc-zephyr-example"
# Size of the heap memory pool used when dynamically allocating memory using k_malloc()
CONFIG_HEAP_MEM_POOL_SIZE=55576

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_EXAMPLE_WIFI_SSID="<insert your ssid here>"
CONFIG_EXAMPLE_WIFI_PSK="<insert your password here>"

# ZMS
CONFIG_ZMS=y
CONFIG_ZMS_LOG_LEVEL_ERR=y

# Secure storage
# The maximal data size is increased compared to the default
# In case the maximal data size is not enough, psa_its_set returns
# PSA_ERROR_INVALID_ARGUMENT (-135) and data can't be saved
# As a result, the deployment fails
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1024
CONFIG_MENDER_PLATFORM_STORAGE_TYPE_PSA_ITS=y
CONFIG_MENDER_PLATFORM_TLS_KEY_LIFETIME_VOLATILE=y
