common:
  sysbuild: True
  timeout: 3600
  slow: true
  harness: pytest
  harness_config:
    pytest_dut_scope: function
    pytest_root:
      - "pytest/test_mender_mcu_client.py"
  platform_allow:
    - esp32_devkitc/esp32/procpu
    - nucleo_l4a6zg
  tags:
    - testing
    - pytest
    - shell

