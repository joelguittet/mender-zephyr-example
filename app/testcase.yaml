    timeout: 3600
    slow: true
    extra_args: EXTRA_CONF_FILE="troubleshoot.conf"
    harness: pytest
    harness_config:
      pytest_dut_scope: function
      pytest_root:
        - "pytest/test_mender_mcu_client.py"
    platform_allow:
